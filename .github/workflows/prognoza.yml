# Prognoza smogu dla RMWpogoda (RMW 7.217, 7.221): codziennie pobiera prognozę CAMS (0–96 h), tnie na kafle JSON
# i publikuje je na gałąź gh-pages (GitHub Pages: Settings → Pages → Deploy from a branch → gh-pages / root).
# Dwa terminy: 07:35 UTC (0–48 h; godziny 49–96 przychodzą później — 27.11 jeszcze nie o 09:21, już o 14:12 UTC)
# i 13:35 UTC (komplet 0–96 h).
# Publikacja = jeden nadpisywany commit na gh-pages (repo nie rośnie). Błąd = stare kafle zostają; RMWpogoda
# nie pokazuje godzin, które już minęły.
# Podtrzymanie (27.11): GitHub wyłącza harmonogram w publicznym repo po 60 dniach bez aktywności. Każdy przebieg
# woła API „enable workflow” (przesuwa początek 60 dni), a raz w miesiącu commituje datę do PODTRZYMANIE.txt
# na gałęzi domyślnej (commit = aktywność repo wg dokumentacji GitHuba).
# Strażnik (RMW 7.220): harmonogram GitHuba bywa pomijany (27.11: 11:35 UTC nie ruszył) — projekt Apps Script
# RMWpogoda co godzinę sprawdza indeks.json i, gdy brak dzisiejszego przebiegu, uruchamia ten workflow przez API
# (workflow_dispatch). Harmonogram poniżej zostaje jako zapas.
name: Prognoza
on:
  schedule:
    - cron: "35 7 * * *"
    - cron: "35 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: prognoza
  cancel-in-progress: false
jobs:
  prognoza:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Biblioteki
        run: pip install "cdsapi>=0.7.4" xarray netCDF4 numpy
      - name: Pobranie i kafle
        env:
          ADS_KEY: ${{ secrets.ADS_KEY }}
        run: python skrypty/prognoza.py
      - name: Publikacja na gh-pages
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd publikacja
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prognoza $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
      - name: Podtrzymanie harmonogramu
        if: always()   # każdy przebieg (harmonogram, strażnik RMWpogoda, ręczny), także gdy pobranie z ADS padło
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X PUT "repos/${REPO}/actions/workflows/prognoza.yml/enable" && echo "enable: OK" || echo "enable: błąd (nie przerywa)"
          cd "$GITHUB_WORKSPACE"
          MIES=$(date -u +%Y-%m)
          if [ "$(cat PODTRZYMANIE.txt 2>/dev/null)" != "$MIES" ]; then
            echo "$MIES" > PODTRZYMANIE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PODTRZYMANIE.txt
            git commit -q -m "Podtrzymanie harmonogramu ${MIES}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && echo "commit podtrzymania: ${MIES}" || echo "commit podtrzymania: błąd (nie przerywa)"
          else
            echo "commit podtrzymania: już jest na ${MIES}"
          fi
